<!DOCTYPE html>
<html lang="fr" class="h-full bg-zinc-950 text-zinc-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 24 Juin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans antialiased flex flex-col max-w-md mx-auto border-x border-zinc-800 bg-zinc-900 shadow-2xl">

    <!-- HEADER & COUNTDOWN -->
    <header class="p-6 border-b border-zinc-800 bg-zinc-950 sticky top-0 z-10">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">SHRED PROTOCOL</h1>
                <p class="text-xs text-zinc-400">Objectif : 24 Juin 2026</p>
            </div>
            <div class="text-right">
                <span id="countdown" class="text-2xl font-black text-amber-500 font-mono">--j --h</span>
                <p class="text-[10px] text-zinc-500 uppercase tracking-wider">Temps restant</p>
            </div>
        </div>
        
        <!-- Global Progress Bar -->
        <div class="mt-4">
            <div class="flex justify-between text-xs text-zinc-400 mb-1">
                <span>Progression Globale</span>
                <span id="global-pct" class="font-mono">0%</span>
            </div>
            <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                <div id="global-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- DAY SELECTOR (Horizontal Scroll) -->
        <section class="flex gap-2 overflow-x-auto pb-2 scrollbar-none snap-x">
            <!-- Dynamically populated by JS -->
            <div id="day-tokens" class="flex gap-2"></div>
        </section>

        <!-- CURRENT DAY VIEW -->
        <section class="space-y-4">
            <h2 id="current-day-title" class="text-lg font-bold text-zinc-200 px-1">Jour 1</h2>
            
            <!-- CATEGORY: NUTRITION -->
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-500">Nutrition (1600 kcal)</h3>
                    <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-400">Low-Carb / High-Prot</span>
                </div>
                <div class="space-y-2.5">
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="diet" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <span class="text-sm text-zinc-300">Respect strict de la diète <span class="text-xs text-zinc-500">(Zéro sucre/féculent, 180g Prot)</span></span>
                    </label>
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="water" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <span class="text-sm text-zinc-300">Hydratation <span class="text-xs text-zinc-500">(3 Litres d'eau minimum)</span></span>
                    </label>
                </div>
            </div>

            <!-- CATEGORY: TRAINING -->
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-500">Entraînement</h3>
                    <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-400">Dos Protégé</span>
                </div>
                <div class="space-y-2.5">
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="cardio" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <div class="text-sm text-zinc-300">
                            <p>Matin: Cardio Concept2</p>
                            <p class="text-xs text-zinc-500">45 min à jeun | DF: 4 | 20-22 cpm</p>
                        </div>
                    </label>
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="workout" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <div class="text-sm text-zinc-300">
                            <p>Soir: Renforcement PDC <span class="text-xs text-zinc-400">(Lun, Mar, Jeu, Ven)</span></p>
                            <p class="text-xs text-zinc-500">4 tours: 15 Squats, 15 Pompes / 20 Dead Bug, 15 Bridges + Planche</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- CATEGORY: ACTIVITY & RECOVERY -->
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-500">Activité & Récupération</h3>
                </div>
                <div class="space-y-2.5">
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="neat" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <span class="text-sm text-zinc-300">NEAT : Marche quotidienne <span class="text-xs text-zinc-500">(10k - 12k pas)</span></span>
                    </label>
                    <label class="flex items-start gap-3 p-2 rounded bg-zinc-900/50 cursor-pointer">
                        <input type="checkbox" data-task="sleep" class="task-checkbox mt-1 h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-amber-500 focus:ring-0 focus:ring-offset-0">
                        <span class="text-sm text-zinc-300">Sommeil récupérateur <span class="text-xs text-zinc-500">(8 heures strictes)</span></span>
                    </label>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER / UTILS -->
    <footer class="p-4 border-t border-zinc-800 bg-zinc-950 flex justify-between text-xs text-zinc-500">
        <span>Sprint Tracker v1.0</span>
        <button onclick="resetAllData()" class="text-red-400 active:text-red-500 font-medium">Réinitialiser les données</button>
    </footer>

    <!-- INTERACTIVE LOGIC -->
    <script>
        const TARGET_DATE = new Date("June 24, 2026 00:00:00").getTime();
        const START_DATE = new Date("May 31, 2026 00:00:00");
        const TOTAL_DAYS = 24; 
        let activeDay = 1;
        let appData = JSON.parse(localStorage.getItem('shred_tracker_data')) || {};

        // Countdown Timer
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = TARGET_DATE - now;
            if (distance < 0) {
                document.getElementById("countdown").innerText = "0j 0h";
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("countdown").innerText = `${days}j ${hours}h`;
        }
        setInterval(updateCountdown, 60000);
        updateCountdown();

        // Calculate dynamic active day based on current date
        function setInitialActiveDay() {
            const today = new Date();
            const diffTime = today - START_DATE;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            activeDay = Math.max(1, Math.min(diffDays, TOTAL_DAYS));
        }

        // Render Horizontal Day Selector
        function renderDayTokens() {
            const container = document.getElementById('day-tokens');
            container.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const dayKey = `day_${i}`;
                const completedCount = Object.values(appData[dayKey] || {}).filter(Boolean).length;
                const isPerfect = completedCount === 6;
                
                let bgClass = 'bg-zinc-800 text-zinc-400 border-transparent';
                if (i === activeDay) bgClass = 'bg-amber-500 text-zinc-950 font-bold border-amber-300 scale-105';
                else if (isPerfect) bgClass = 'bg-emerald-950 text-emerald-400 border-emerald-800';
                else if (completedCount > 0) bgClass = 'bg-zinc-800 text-zinc-200 border-zinc-700';

                const btn = document.createElement('button');
                btn.className = `w-12 h-12 rounded-lg text-xs flex flex-col items-center justify-center border transition-all snap-center flex-shrink-0 ${bgClass}`;
                btn.innerHTML = `<span>J${i}</span><span class="text-[9px] opacity-60">${completedCount}/6</span>`;
                btn.onclick = () => selectDay(i);
                container.appendChild(btn);
            }
        }

        // Handle day selection switching
        function selectDay(dayNumber) {
            activeDay = dayNumber;
            document.getElementById('current-day-title').innerText = `Jour ${activeDay}`;
            loadDayData();
            renderDayTokens();
        }

        // Load data of active day into checkboxes
        function loadDayData() {
            const dayKey = `day_${activeDay}`;
            const dayData = appData[dayKey] || {};
            
            document.querySelectorAll('.task-checkbox').forEach(checkbox => {
                const task = checkbox.getAttribute('data-task');
                checkbox.checked = !!dayData[task];
            });
            updateGlobalProgress();
        }

        // Update Global Stats
        function updateGlobalProgress() {
            let totalTasks = TOTAL_DAYS * 6;
            let completedTasks = 0;
            
            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const dayData = appData[`day_${i}`] || {};
                completedTasks += Object.values(dayData).filter(Boolean).length;
            }
            
            const pct = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            document.getElementById('global-pct').innerText = `${pct}%`;
            document.getElementById('global-bar').style.width = `${pct}%`;
        }

        // Save states on change
        document.querySelectorAll('.task-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const task = e.target.getAttribute('data-task');
                const dayKey = `day_${activeDay}`;
                
                if (!appData[dayKey]) appData[dayKey] = {};
                appData[dayKey][task] = e.target.checked;
                
                localStorage.setItem('shred_tracker_data', JSON.stringify(appData));
                loadDayData();
                renderDayTokens();
            });
        });

        function resetAllData() {
            if(confirm("Réinitialiser tout le suivi ? Cette action est irréversible.")) {
                localStorage.removeItem('shred_tracker_data');
                appData = {};
                loadDayData();
                renderDayTokens();
            }
        }

        // Init
        setInitialActiveDay();
        selectDay(activeDay);
    </script>
</body>
</html>
