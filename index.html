<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health OS</title>
  <meta name="description" content="Coach sport-santé personnel : musculation Spine-First, rameur Concept2, routine dos. 100 % hors-ligne.">
  <meta name="theme-color" content="#f4f2ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health OS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Thème appliqué avant le premier rendu (évite le flash)
    try {
      var s = JSON.parse(localStorage.getItem('health_os_settings_v11') || 'null');
      var t = s ? s.theme : (localStorage.getItem('health_os_theme_v10') || 'auto');
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Health OS a besoin de JavaScript.</p></noscript>
</body>
</html>
