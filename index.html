    const playChime = (freq = 528, type = 'sine', duration = 0.35) => {
      if (window.__soundEnabled === false) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    const fetchWithRetry = async (url, options, maxRetries = 2) => {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return response;
          if (response.status === 429 || response.status >= 500) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          return response;
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
      return fetch(url, options);
    };

    const callGemini = async (prompt, systemInstruction = "", userContext = {}, apiKey = "") => {
      // Support single key or multiple keys (separated by comma, semicolon, or newlines)
      const cleanKeys = (apiKey || '')
        .split(/[\n,;]+/)
        .map(k => k.trim())
        .filter(k => k.length > 5);
      
      if (cleanKeys.length === 0) {
        return generateLocalExpertResponse(prompt, userContext);
      }

      // Priority: Gemini 3 Flash first, then 2.5 Flash fallback
      const modelsToTry = [
        "gemini-3-flash-preview",
        "gemini-2.5-flash"
      ];

      for (const key of cleanKeys) {
        for (const model of modelsToTry) {
          try {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            const payload = {
              contents: [{ role: "user", parts: [{ text: prompt }] }],
              systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
            };
            const res = await fetchWithRetry(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            
            if (res.ok) {
              const data = await res.json();
              const output = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (output && output.trim().length > 0) {
                return output;
              }
            }
          } catch (err) {
            console.warn(`Model ${model} attempt failed with key:`, err);
          }
        }
      }

      console.warn("All Gemini API keys/calls failed, switching to local expert engine");
      const fallbackText = generateLocalExpertResponse(prompt, userContext);
      return fallbackText + "\n\n*(⚡ Note : Analyse produite par le Moteur Biomécanique Local — Clé API inaccessible ou hors-ligne)*";
    };

    const formatMarkdown = (text) => {
      if (!text) return null;
      // Strip any raw [SESSION_DATA] tags before rendering markdown
      const cleanText = text.replace(/\[SESSION_DATA\][\s\S]*?\[\/SESSION_DATA\]/g, '').trim();
      return cleanText.split('\n\n').map((block, idx) => {
        if (block.startsWith('### ') || block.startsWith('## ') || block.startsWith('# ')) {
          const clean = block.replace(/^#+\s*/, '');
          return <h4 key={idx} className="font-bold text-xs mt-2 mb-1 text-[#324f42]">{clean}</h4>;
        }
        if (block.startsWith('* ') || block.startsWith('- ')) {
          const items = block.split('\n').map(l => l.replace(/^[\*\-]\s*/, '').trim()).filter(Boolean);
          return (
            <ul key={idx} className="list-disc list-inside space-y-1 my-1 text-xs opacity-90">
              {items.map((it, i) => (
                <li key={i} dangerouslySetInnerHTML={{ __html: it.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }} />
              ))}
            </ul>
          );
        }
        return (

            __html: block.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
          }} />
        );
      });
    };

      const sendPwaNotification = (title, body, tag = 'health-os-alert') => {
        const savedNotif = localStorage.getItem('health_os_notif_enabled');
        if (savedNotif !== 'true' || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        const options = {
          body,
          icon: 'icon.svg',
          badge: 'icon.svg',
          tag
        };
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, options);
          }).catch(() => {
            try { new Notification(title, options); } catch (e) {}
          });
        } else {

      const checkScheduledNotifications = () => {
        const savedNotif = localStorage.getItem('health_os_notif_enabled');
        if (savedNotif !== 'true' || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;

        const now = new Date();
        const hour = now.getHours();
        const minute = now.getMinutes();
        const todayStr = now.toISOString().split('T')[0];

        // 1. Rappel du Matin (avant 8h : fenêtre 07h00 - 07h59)
        const lastMorning = localStorage.getItem('health_os_notif_morning');
        if (hour >= 7 && hour < 8 && lastMorning !== todayStr) {

            "Health & Longevity OS • Matin",
            "☀️ Bonjour ! Votre bilan express & séance du jour sont prêts pour protéger votre dos (L4-L5).",

          localStorage.setItem('health_os_notif_morning', todayStr);
        }

        // 2. Rappel du Soir (vers 21h : fenêtre 20h30 - 21h30)
        const lastEvening = localStorage.getItem('health_os_notif_evening');
        const isEvening = (hour === 20 && minute >= 30) || (hour === 21 && minute <= 30);
        if (isEvening && lastEvening !== todayStr) {
          const hasSessionToday = workouts.some(w => w.date === todayStr);
          const savedCoreDate = localStorage.getItem('health_os_core_date_v10');
          const hasCoreToday = savedCoreDate === todayStr;

            );
            localStorage.setItem('health_os_notif_evening', todayStr);
          }
        }

      const handleParsePasteSummary = (text) => {
        if (!text || !text.trim()) return;
        const lower = text.toLowerCase();
        
        let distanceM = null;
        const distMatch = lower.match(/(\d+[\.,]?\d*)\s*(km|m|mètres|metres)/);
        if (distMatch) {
          const val = parseFloat(distMatch[1].replace(',', '.'));
          distanceM = distMatch[2].startsWith('k') ? Math.round(val * 1000) : Math.round(val);
        }

        let durationMin = 35;
        const timeHMatch = lower.match(/(\d+)\s*h\s*(\d*)/);
        if (timeHMatch) {
          const h = parseInt(timeHMatch[1], 10);
          const m = parseInt(timeHMatch[2] || '0', 10);
          durationMin = h * 60 + m;
        } else {
          const colonMatch = lower.match(/(\d+):(\d{2})/);
          if (colonMatch) {
            durationMin = parseInt(colonMatch[1], 10);
          } else {
            const minMatch = lower.match(/(\d+)\s*(min|m)/);
            if (minMatch) durationMin = parseInt(minMatch[1], 10);
          }
        }

        let type = 'SWIM';
        let defaultNote = 'Import texte';
        if (lower.includes('natat') || lower.includes('nage') || lower.includes('piscine') || lower.includes('swim')) {
          type = 'SWIM';
          defaultNote = `Natation : ${distanceM ? distanceM + 'm' : durationMin + ' min'}`;
        } else if (lower.includes('rando') || lower.includes('hike') || lower.includes('marche') || lower.includes('montagne')) {
          type = 'HIKE';
          defaultNote = `Randonnée : ${durationMin} min`;
        } else if (lower.includes('rameur') || lower.includes('concept') || lower.includes('erg')) {
          type = 'CONCEPT2';
          defaultNote = 'Concept2 (Import texte)';
        }

        handleAddManualSession(type, durationMin, null, null, distanceM, defaultNote);
        setShowPasteModal(false);
        setPasteText('');
        showToast(`Séance ${type} ajoutée depuis le texte copié !`);
      };

      const handleImportConcept2Csv = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const lines = evt.target.result.split('\n').filter(l => l.trim().length > 0);
            let count = 0;
            const newLogs = [...workouts];
            for (let i = 1; i < lines.length; i++) {
              const c = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
              if (c.length >= 4) {
                const w = parseFloat(c[2]) || 105;
                const cad = parseInt(c[3], 10) || 20;
                newLogs.unshift({
                  id: Date.now() + i,
                  date: c[0] || new Date().toISOString().split('T')[0],
                  type: 'CONCEPT2',
                  durationMin: parseInt(c[1], 10) || 16,
                  watts: w,
                  cadence: cad,
                  spi: cad > 0 ? Number((w / cad).toFixed(2)) : null,
                  level: currentLevel,
                  notes: 'Import ErgData CSV'
                });
                count++;
              }
            }
            if (count > 0) {
              setWorkouts(newLogs);

        reader.readAsText(file);
      };

      const handleImportHuaweiFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

        reader.onload = (evt) => {
          const content = evt.target.result;
          try {
            let sessionDate = new Date().toISOString().split('T')[0];
            let durationMin = 35;
            let distanceM = 750;
            let activityType = 'SWIM';
            let notes = 'Montre Huawei Santé';

            if (fileName.endsWith('.tcx')) {
              const parser = new DOMParser();
              const xml = parser.parseFromString(content, "text/xml");
              const activityEl = xml.querySelector('Activity');
              const sportAttr = activityEl ? activityEl.getAttribute('Sport') : '';
              if (sportAttr && (sportAttr.toLowerCase().includes('hike') || sportAttr.toLowerCase().includes('run') || sportAttr.toLowerCase().includes('walk'))) {
                activityType = 'HIKE';
              } else {
                activityType = 'SWIM';
              }

              const idEl = xml.querySelector('Id');
              if (idEl && idEl.textContent) sessionDate = idEl.textContent.split('T')[0];

              const totalTimeEl = xml.querySelector('TotalTimeSeconds');
              if (totalTimeEl) durationMin = Math.round(parseFloat(totalTimeEl.textContent) / 60);

              const distEl = xml.querySelector('DistanceMeters');
              if (distEl) distanceM = Math.round(parseFloat(distEl.textContent));

              notes = activityType === 'SWIM' ? `Piscine TCX (${distanceM}m)` : `Montagne TCX (${distanceM}m)`;

            } else if (fileName.endsWith('.gpx')) {
              activityType = 'HIKE';
              notes = 'Montre Huawei GPX (Randonnée)';
            }

            const newSession = {
              id: Date.now(),
              date: sessionDate,
              type: activityType,

              notes: notes
            };

        reader.readAsText(file);

                  </div>

                  {/* Chat message stream */}
                  <div className="space-y-2.5 max-h-64 overflow-y-auto p-2.5 rounded-xl bg-black/5 dark:bg-white/5 text-xs">
                    {aiChatMessages.map((msg, idx) => (
                      <div 
                        key={idx} 
                        className={`p-3 rounded-xl leading-relaxed ${
                          msg.role === 'user' 
                            ? 'bg-[#324f42] text-white ml-6 font-medium' 
                            : `${st.subCard} mr-4 border border-[#e2ded6] dark:border-zinc-800`
                        }`}
                      >
                        <p className="text-[10px] uppercase font-bold opacity-70 mb-1">
                          {msg.role === 'user' ? 'Vous' : 'Coach IA'}
                        </p>
                        <div className="ai-content">
                          {formatMarkdown(msg.text)}
                        </div>
                        {msg.sessionData && (
                          <button
                            onClick={() => {
                              handleAddManualSession(
                                msg.sessionData.type || 'CONCEPT2',
                                Number(msg.sessionData.durationMin) || 15,
                                msg.sessionData.watts ? Number(msg.sessionData.watts) : null,
                                msg.sessionData.cadence ? Number(msg.sessionData.cadence) : null,
                                msg.sessionData.distanceM ? Number(msg.sessionData.distanceM) : null,
                                msg.sessionData.notes || 'Séance suggérée par le Coach IA'
                              );
                              showToast("✓ Séance consignée dans votre Journal !");
                              playChime(528, 'sine', 0.2);
                            }}
                            className="mt-2.5 w-full py-2 px-3 rounded-lg text-xs font-bold bg-[#446857] text-white flex items-center justify-center gap-1.5 hover:bg-[#324f42] transition shadow-sm"
                          >
                            <IconCheck className="w-3.5 h-3.5" />
                            ⚡ Consigner cette séance ({msg.sessionData.durationMin || 15} min{msg.sessionData.watts ? ` • ${msg.sessionData.watts}W` : ''})
                          </button>
                        )}
                      </div>
                    ))}
                    {aiChatLoading && (
                      <div className={`p-3 rounded-xl ${st.subCard} mr-4 text-xs italic opacity-70`}>
                        Analyse biomécanique en cours...
                      </div>
                    )}
                  </div>

                  {/* Quick prompt chips */}
                  <div className="flex flex-wrap gap-1.5 pt-0.5">
                    <button 
                      onClick={() => setAiChatInput("C'est quoi les exercices de Workout A et B ?")}
                      className="text-[10.5px] px-2.5 py-1 rounded-lg border border-[#e2ded6] dark:border-zinc-700 hover:border-[#446857] transition opacity-80"
                    >
                      🏋️ Workout A & B ?
                    </button>
                    <button 
                      onClick={() => setAiChatInput("Pourquoi mon dos fait mal à 100W sur le rameur ?")}
                      className="text-[10.5px] px-2.5 py-1 rounded-lg border border-[#e2ded6] dark:border-zinc-700 hover:border-[#446857] transition opacity-80"
                    >
                      🚣 Douleur à 100W ?
                    </button>
                    <button 
                      onClick={() => setAiChatInput("Rappelle-moi la Routine Sol de 4 min pour ce soir")}
                      className="text-[10.5px] px-2.5 py-1 rounded-lg border border-[#e2ded6] dark:border-zinc-700 hover:border-[#446857] transition opacity-80"
                    >
                      🌙 Routine Sol 4 min ?
                    </button>
                    <button 
                      onClick={() => setAiChatInput("Combien de protéines et quel déficit pour mon poids ?")}
                      className="text-[10.5px] px-2.5 py-1 rounded-lg border border-[#e2ded6] dark:border-zinc-700 hover:border-[#446857] transition opacity-80"
                    >
                      🥩 Protéines & Nutrition ?
                    </button>
                  </div>

                  {/* Input area */}
                  <div className="flex gap-2 pt-1">
                    <input 
                      type="text" 
                      value={aiChatInput}
                      onChange={e => setAiChatInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleSendAiChat()}
                      placeholder="Question sur dos, musculation, rameur, minéraux, nutrition..."
                      className={`flex-1 px-3 py-2 rounded-xl text-xs border outline-none ${st.subCard}`}
                    />
                    <button
                      onClick={handleSendAiChat}
                      disabled={aiChatLoading || !aiChatInput.trim()}
                      className={`px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center justify-center transition ${st.btnPrimary}`}
                    >
                      <IconSend className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {/* Workout History List */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3 shadow-sm`}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <IconCalendar className="w-3.5 h-3.5 text-[#446857]" /> Journal des Séances
                    </span>
                    <span className="text-[10.5px] opacity-70">{workouts.length} enregistrée{workouts.length > 1 ? 's' : ''}</span>
                  </div>

                  {workouts.length === 0 ? (
                    <div className="p-6 text-center text-xs opacity-60">
                      Aucune séance enregistrée pour le moment.<br />Consignez votre premier entraînement depuis l'onglet « Aujourd'hui » !
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {workouts.map(w => (
                        <div key={w.id} className={`p-3 rounded-xl border flex items-center justify-between text-xs ${st.subCard}`}>
                          <div className="space-y-0.5">
                            <div className="flex items-center space-x-2">
                              <span className="font-bold">{w.date}</span>
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                                w.type === 'CONCEPT2' ? st.accentBg :
                                w.type === 'SWIM' ? 'bg-cyan-500/15 text-cyan-800' :
                                w.type === 'HIKE' ? 'bg-amber-500/15 text-amber-800' : 
                                w.type === 'WORK_GYM' ? 'bg-purple-500/15 text-purple-800 dark:text-purple-300' :
                                'bg-stone-500/15 text-stone-800'
                              }`}>
                                {w.type === 'WORK_GYM' ? (w.notes?.includes('Workout A') ? 'WORKOUT A' : w.notes?.includes('Workout B') ? 'WORKOUT B' : 'SALLE 35M') :
                                 w.type === 'CORE_SHIELD' ? (w.notes?.includes('Routine Sol') ? 'SOL SOIR' : 'CORE SHIELD') :
                                 w.type}
                              </span>
                              {w.level && <span className={`text-[10px] ${st.subtext}`}>Niv.{w.level}</span>}
                            </div>
                            <p className={`text-[11px] ${st.subtext}`}>{w.notes}</p>
                          </div>

                          {w.spi ? (
                            <div className="text-right">
                              <span className="font-bold text-[#446857]">{w.spi} SPI</span>
                              <p className={`text-[10px] ${st.subtext}`}>{w.watts}W @ {w.cadence}s/m</p>
                            </div>
                          ) : w.distanceM ? (
                            <div className="text-right">
                              <span className="font-bold text-cyan-800">{w.distanceM} m</span>
                              <p className={`text-[10px] ${st.subtext}`}>{w.durationMin} min</p>
                            </div>
                          ) : (
                            <span className={`text-[11px] ${st.subtext}`}>{w.durationMin} min</span>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Sticky Bottom Navigation Bar (3 Ergonomic Tabs) */}
          <nav className={`fixed bottom-0 left-0 right-0 z-40 ${st.nav} backdrop-blur border-t max-w-xl mx-auto flex items-center justify-around py-1 px-3 safe-bottom text-xs`}>
            <button
              onClick={() => setActiveTab('today')}
              className={`flex-1 min-h-[48px] flex flex-col items-center justify-center py-1 rounded-xl transition ${
                activeTab === 'today' ? st.activeNav : st.subtext
              }`}
            >
              <IconActivity className="w-5 h-5 mb-0.5" />
              <span className="text-[11px] font-medium">Aujourd'hui</span>
            </button>

            <button
              onClick={() => setActiveTab('training')}
              className={`flex-1 min-h-[48px] flex flex-col items-center justify-center py-1 rounded-xl transition ${
                activeTab === 'training' ? st.activeNav : st.subtext
              }`}
            >
              <IconLayers className="w-5 h-5 mb-0.5" />
              <span className="text-[11px] font-medium">Progression</span>
            </button>

            <button
              onClick={() => setActiveTab('history')}
              className={`flex-1 min-h-[48px] flex flex-col items-center justify-center py-1 rounded-xl transition ${
                activeTab === 'history' ? st.activeNav : st.subtext
              }`}
            >
              <IconCalendar className="w-5 h-5 mb-0.5" />
              <span className="text-[11px] font-medium">Journal & Outils</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
