    // --- ACOUSTIC CHIME SYNTHESIZER ---
    const playChime = (freq = 528, type = 'sine', duration = 0.35) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    const fetchWithRetry = async (url, options, maxRetries = 2) => {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return response;
          if (response.status === 429 || response.status >= 500) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          return response;
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
      return fetch(url, options);
    };

    const callGemini = async (prompt, systemInstruction = "", userContext = {}, apiKey = "") => {
      const cleanKey = (apiKey || '').trim();
      
      if (!cleanKey) {
        return generateLocalExpertResponse(prompt, userContext);
      }

      // Priority: Gemini 3 Flash first, then 2.5 Flash fallback
      const modelsToTry = [
        "gemini-3-flash-preview",
        "gemini-2.5-flash"
      ];

      for (const model of modelsToTry) {
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`;
          const payload = {
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
          };
          const res = await fetchWithRetry(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          
          if (res.ok) {
            const data = await res.json();
            const output = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (output && output.trim().length > 0) {
              return output;
            }
          }
        } catch (err) {
          console.warn(`Model ${model} attempt failed:`, err);
        }
      }

      console.warn("Gemini API calls failed, switching to local expert engine");
      const fallbackText = generateLocalExpertResponse(prompt, userContext);
      return fallbackText + "\n\n*(⚡ Note : Analyse produite par le Moteur Biomécanique Local — Clé API inaccessible ou hors-ligne)*";
    };

    const formatMarkdown = (text) => {
      if (!text) return null;
      return text.split('\n\n').map((block, idx) => {

          const clean = block.replace(/^#+\s*/, '');
          return <h4 key={idx} className="font-bold text-xs mt-2 mb-1 text-[#324f42]">{clean}</h4>;

        if (block.startsWith('* ') || block.startsWith('- ')) {

            __html: block.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
          }} />
        );
      });

          distanceM = distMatch[2].startsWith('k') ? Math.round(val * 1000) : Math.round(val);

          const m = parseInt(timeHMatch[2] || '0', 10);

          if (colonMatch) {

        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.workouts) {
              setWorkouts(parsed.workouts);
              if (parsed.userProfile?.currentLevel) setCurrentLevel(parsed.userProfile.currentLevel);
              showToast("Données restaurées avec succès !");
            }
          } catch (err) {
            showToast("Erreur de lecture du fichier JSON.");
          }
        };
        reader.readAsText(file);
      };

      const handleImportConcept2Csv = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const lines = evt.target.result.split('\n').filter(l => l.trim().length > 0);
            let count = 0;
            const newLogs = [...workouts];
            for (let i = 1; i < lines.length; i++) {
              const c = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
              if (c.length >= 4) {
                const w = parseFloat(c[2]) || 105;
                const cad = parseInt(c[3], 10) || 20;
                newLogs.unshift({
                  id: Date.now() + i,
                  date: c[0] || new Date().toISOString().split('T')[0],
                  type: 'CONCEPT2',
                  durationMin: parseInt(c[1], 10) || 16,
                  watts: w,
                  cadence: cad,
                  spi: cad > 0 ? Number((w / cad).toFixed(2)) : null,
                  level: currentLevel,
                  notes: 'Import ErgData CSV'
                });
                count++;
              }
            }
            if (count > 0) {
              setWorkouts(newLogs);
              showToast(`${count} séance(s) Concept2 importée(s) !`);
              setActiveTab('history');
            }
          } catch (err) {
            showToast("Erreur d'analyse du CSV Concept2.");
          }
        };
        reader.readAsText(file);
      };

      const handleImportHuaweiFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

          const content = evt.target.result;

            let sessionDate = new Date().toISOString().split('T')[0];
            let durationMin = 35;
            let distanceM = 750;
            let activityType = 'SWIM';
            let notes = 'Montre Huawei Santé';

            if (fileName.endsWith('.tcx')) {
              const parser = new DOMParser();
              const xml = parser.parseFromString(content, "text/xml");
              const activityEl = xml.querySelector('Activity');
              const sportAttr = activityEl ? activityEl.getAttribute('Sport') : '';
              if (sportAttr && (sportAttr.toLowerCase().includes('hike') || sportAttr.toLowerCase().includes('run') || sportAttr.toLowerCase().includes('walk'))) {
                activityType = 'HIKE';
              } else {
                activityType = 'SWIM';
              }

              const idEl = xml.querySelector('Id');
              if (idEl && idEl.textContent) sessionDate = idEl.textContent.split('T')[0];

              const totalTimeEl = xml.querySelector('TotalTimeSeconds');
              if (totalTimeEl) durationMin = Math.round(parseFloat(totalTimeEl.textContent) / 60);

              const distEl = xml.querySelector('DistanceMeters');
              if (distEl) distanceM = Math.round(parseFloat(distEl.textContent));

              notes = activityType === 'SWIM' ? `Piscine TCX (${distanceM}m)` : `Montagne TCX (${distanceM}m)`;

            } else if (fileName.endsWith('.gpx')) {
              activityType = 'HIKE';
              notes = 'Montre Huawei GPX (Randonnée)';
            }

            const newSession = {
              id: Date.now(),
              date: sessionDate,
              type: activityType,
              durationMin: durationMin || 35,
              distanceM: distanceM || 750,
              notes: notes
            };

            setWorkouts([newSession, ...workouts]);
            showToast(`Séance ${activityType === 'SWIM' ? 'Natation' : 'Activité'} Huawei importée !`);

            {activeTab === 'erg' && (
              <div className="space-y-4">
                {/* 1:2 Cadence Metronome */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <IconActivity className="w-3.5 h-3.5 text-[#446857]" /> Métronome Tempo 1:2 (20 s/m)
                    </span>
                    <button
                      onClick={() => setIsMetronomeActive(!isMetronomeActive)}
                      className={`px-3 py-1 rounded-full text-xs font-medium transition ${isMetronomeActive ? st.btnPrimary : st.btnSecondary}`}
                    >
                      {isMetronomeActive ? 'En marche' : 'Désactivé'}
                    </button>
                  </div>

                  <p className={`text-xs ${st.subtext}`}>
                    1 seconde de propulsion vive sur les jambes, 2 secondes de retour lent et relâché.
                  </p>

                  <div className="grid grid-cols-2 gap-2 text-center pt-1">
                    <div className={`p-3 rounded-xl border transition-all ${isMetronomeActive && metronomePhase === 'drive' ? 'bg-[#446857]/20 border-[#446857] font-bold' : st.subCard}`}>
                      <p className="text-xs uppercase font-semibold">1. Propulsion</p>
                      <p className="text-lg font-bold mt-0.5">1.0 sec</p>
                    </div>
                    <div className={`p-3 rounded-xl border transition-all ${isMetronomeActive && metronomePhase === 'recovery' ? 'bg-[#446857]/20 border-[#446857] font-bold' : st.subCard}`}>
                      <p className="text-xs uppercase font-semibold">2. Glisse (Repos)</p>
                      <p className="text-lg font-bold mt-0.5">2.0 sec</p>
                    </div>
                  </div>
                </div>

                {/* SPI Logger */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                    <IconFlame className="w-3.5 h-3.5 text-[#446857]" /> Enregistrer une Séance Rameur
                  </span>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`text-xs ${st.subtext}`}>Watts Moyens :</label>
                      <input 
                        type="number" value={calcWatts} onChange={e => setCalcWatts(Number(e.target.value))}
                        className={`w-full mt-1 px-3 py-2 rounded-xl text-xs font-bold border outline-none ${st.subCard}`}
                      />
                    </div>
                    <div>
                      <label className={`text-xs ${st.subtext}`}>Cadence (s/m) :</label>
                      <input 
                        type="number" value={calcCadence} onChange={e => setCalcCadence(Number(e.target.value))}
                        className={`w-full mt-1 px-3 py-2 rounded-xl text-xs font-bold border outline-none ${st.subCard}`}
                      />
                    </div>
                  </div>

                  <div className={`p-3 rounded-xl border flex items-center justify-between ${st.subCard}`}>
                    <div>
                      <p className="text-xs font-medium">Stroke Power Index (SPI) :</p>
                      <p className={`text-[11px] ${st.subtext}`}>
                        {calculatedSpi >= 6.0 ? '✓ Niveau Puissance Confirmé (Torque optimal)' : calculatedSpi >= 5.0 ? '✓ Niveau Régularité (Dos protégé)' : '⚠ Poussez plus fort sur les jambes à cadence lente'}
                      </p>
                    </div>
                    <span className="text-xl font-bold">{calculatedSpi}</span>
                  </div>

                  <button
                    onClick={() => handleAddManualSession('CONCEPT2', 20, calcWatts, calcCadence, null, `Séance Niveau ${currentLevel} (${activeLevelData.format})`)}
                    className={`w-full py-2.5 rounded-xl text-xs font-semibold transition ${st.btnPrimary}`}
                  >
                    + Valider cette séance dans le Journal
                  </button>
                </div>
              </div>
            )}

            {/* TAB: JOURNAL & HISTORIQUE */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <IconCalendar className="w-3.5 h-3.5 text-[#446857]" /> Journal de Bord Multi-Disciplines
                    </span>
                    <button
                      onClick={handleRunAiAudit}
                      disabled={aiAuditLoading}
                      className={`text-[11px] font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1 transition ${st.btnSecondary}`}
                    >
                      <IconSparkles className="w-3 h-3 text-[#446857]" />
                      {aiAuditLoading ? 'Audit...' : 'Audit IA Longitudinal'}
                    </button>
                  </div>

                  {aiAuditText && (
                    <div className={`p-3.5 rounded-xl border ${st.subCard} border-[#446857]/40 space-y-1`}>
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-bold text-[#446857]">📊 Audit de Progression IA Gemini</span>
                        <button onClick={() => setAiAuditText(null)} className="text-[10px] opacity-60">Fermer</button>
                      </div>
                      <div className="ai-content">
                        {formatMarkdown(aiAuditText)}
                      </div>
                    </div>
                  )}

                  <div className="space-y-2">
                    {workouts.map(w => (
                      <div key={w.id} className={`p-3 rounded-xl border flex items-center justify-between text-xs ${st.subCard}`}>
                        <div className="space-y-0.5">
                          <div className="flex items-center space-x-2">
                            <span className="font-bold">{w.date}</span>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                              w.type === 'CONCEPT2' ? st.accentBg :
                              w.type === 'SWIM' ? 'bg-cyan-500/15 text-cyan-800' :
                              w.type === 'HIKE' ? 'bg-amber-500/15 text-amber-800' : 
                              w.type === 'WORK_GYM' ? 'bg-purple-500/15 text-purple-800' :
                              'bg-stone-500/15 text-stone-800'
                            }`}>
                              {w.type}
                            </span>
                            {w.level && <span className={`text-[10px] ${st.subtext}`}>Niv.{w.level}</span>}
                          </div>
                          <p className={`text-[11px] ${st.subtext}`}>{w.notes}</p>
                        </div>

                        {w.spi ? (
                          <div className="text-right">
                            <span className="font-bold text-[#446857]">{w.spi} SPI</span>
                            <p className={`text-[10px] ${st.subtext}`}>{w.watts}W @ {w.cadence}s/m</p>
                          </div>
                        ) : w.distanceM ? (
                          <div className="text-right">
                            <span className="font-bold text-cyan-800">{w.distanceM} m</span>
                            <p className={`text-[10px] ${st.subtext}`}>{w.durationMin} min</p>
                          </div>
                        ) : (
                          <span className={`text-[11px] ${st.subtext}`}>{w.durationMin} min</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: PARAMÈTRES, IMPORTS & DRIVE */}
            {activeTab === 'settings' && (
              <div className="space-y-4">
                
                {/* Huawei Watch Import */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <div className="flex items-center space-x-2">
                    <IconWatch className="w-4 h-4 text-[#446857]" />
                    <h3 className="text-xs font-bold uppercase tracking-wider">Import Montre Huawei (Natation & Rando)</h3>
                  </div>
                  <p className={`text-xs ${st.subtext}`}>
                    Chargez vos fichiers .TCX ou .GPX exportés depuis l'application Huawei Santé, ou collez le texte d'un résumé partagé.
                  </p>
                  
                  <div className="flex flex-col sm:flex-row gap-2 pt-1">
                    <label className={`flex-1 py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 border cursor-pointer ${st.btnPrimary}`}>
                      <IconUpload className="w-4 h-4" /> Importer .TCX / .GPX
                      <input type="file" accept=".tcx,.gpx,.csv" onChange={handleImportHuaweiFile} className="hidden" />
                    </label>
                    <button 
                      onClick={() => setShowPasteModal(true)}
                      className={`py-2.5 px-4 rounded-xl text-xs font-semibold transition border flex items-center justify-center gap-1.5 ${st.btnSecondary}`}
                    >
                      <IconSparkles className="w-3.5 h-3.5" /> Coller un Résumé Texte
                    </button>
                    <button 
                      onClick={() => setShowSwimModal(true)}
                      className={`py-2.5 px-3 rounded-xl text-xs font-semibold transition border ${st.btnSecondary}`}
                    >
                      Bassin
                    </button>
                  </div>
                </div>

                {/* Concept2 CSV Importer */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <div className="flex items-center space-x-2">
                    <IconFlame className="w-4 h-4 text-[#446857]" />
                    <h3 className="text-xs font-bold uppercase tracking-wider">Import Concept2 ErgData (.CSV)</h3>
                  </div>
                  <p className={`text-xs ${st.subtext}`}>
                    Chargez vos exports CSV depuis Concept2 Online Logbook.
                  </p>
                  <label className={`w-full py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 border cursor-pointer ${st.btnSecondary}`}>
                    <IconUpload className="w-4 h-4" /> Choisir un CSV Concept2
                    <input type="file" accept=".csv" onChange={handleImportConcept2Csv} className="hidden" />
                  </label>
                </div>

                {/* Google Drive JSON Backup (1-Tap Web Share) */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <IconShare className="w-4 h-4 text-[#446857]" />
                      <h3 className="text-xs font-bold uppercase tracking-wider">Sauvegarde Google Drive (1-Tap)</h3>
                    </div>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#446857]/10 text-[#446857] font-semibold">Sans friction</span>
                  </div>
                  <p className={`text-xs leading-relaxed ${st.subtext}`}>
                    Sur mobile, cliquez sur <strong>« Sauvegarder sur Drive »</strong> : le menu natif de votre téléphone s'ouvre, touchez l'icône <em>Google Drive</em> et votre sauvegarde est enregistrée sans téléchargement manuel préalable !
                  </p>
                  <div className="flex flex-col sm:flex-row gap-2 pt-1">
                    <button
                      onClick={handleShareOrExportJson}
                      className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${st.btnPrimary}`}
                    >
                      <IconShare className="w-4 h-4" /> ⚡ 1-Tap Sauvegarder sur Drive
                    </button>
                    <label className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border cursor-pointer ${st.btnSecondary}`}>
                      <IconUpload className="w-4 h-4" /> Restaurer une Sauvegarde JSON
                      <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                    </label>
                  </div>
                </div>

                {/* Visual Theme Selector */}
                <div className={`rounded-2xl p-4 border ${st.card} space-y-3`}>
                  <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                    <IconPalette className="w-3.5 h-3.5 text-[#446857]" /> Ambiance Visuelle
                  </span>
                  <div className="grid grid-cols-3 gap-2 pt-1">
                    <button
                      onClick={() => setTheme('epure')}
                      className={`p-2.5 rounded-xl border text-xs text-center transition flex flex-col items-center gap-1 ${
                        theme === 'epure' ? 'border-[#446857] font-bold bg-[#446857]/10' : st.subCard
                      }`}
                    >
                      <div className="w-5 h-5 rounded-full bg-[#f4f2ee] border border-[#ded8cd]" />
                      <span>Épure Claire</span>
                    </button>
                    <button
                      onClick={() => setTheme('alpine')}
                      className={`p-2.5 rounded-xl border text-xs text-center transition flex flex-col items-center gap-1 ${
                        theme === 'alpine' ? 'border-[#87b38d] font-bold bg-[#87b38d]/15' : st.subCard
                      }`}
                    >
                      <div className="w-5 h-5 rounded-full bg-[#1a211e] border border-[#2f3a35]" />
                      <span>Forêt Alpine</span>
                    </button>
                    <button
                      onClick={() => setTheme('graphite')}
                      className={`p-2.5 rounded-xl border text-xs text-center transition flex flex-col items-center gap-1 ${
                        theme === 'graphite' ? 'border-zinc-400 font-bold bg-zinc-800' : st.subCard
                      }`}
                    >
                      <div className="w-5 h-5 rounded-full bg-zinc-950 border border-zinc-700" />
                      <span>Graphite Mat</span>
                    </button>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* Sticky Bottom Navigation Bar */}
          <nav className={`fixed bottom-0 left-0 right-0 z-40 ${st.nav} backdrop-blur border-t max-w-xl mx-auto flex items-center justify-around py-2 px-1 text-[11px]`}>
            <button
              onClick={() => setActiveTab('today')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'today' ? st.activeNav : st.subtext}`}
            >
              <IconActivity className="w-4 h-4 mb-0.5" />
              Aujourd'hui
            </button>

            <button
              onClick={() => setActiveTab('ai')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'ai' ? st.activeNav : st.subtext}`}
            >
              <IconBrain className="w-4 h-4 mb-0.5" />
              Coach IA
            </button>

            <button
              onClick={() => setActiveTab('load')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'load' ? st.activeNav : st.subtext}`}
            >
              <IconLayers className="w-4 h-4 mb-0.5" />
              Paliers
            </button>

            <button
              onClick={() => setActiveTab('core')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'core' ? st.activeNav : st.subtext}`}
            >
              <IconShield className="w-4 h-4 mb-0.5" />
              Core (5m)
            </button>

            <button
              onClick={() => setActiveTab('erg')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'erg' ? st.activeNav : st.subtext}`}
            >
              <IconFlame className="w-4 h-4 mb-0.5" />
              Rameur
            </button>

            <button
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'history' ? st.activeNav : st.subtext}`}
            >
              <IconCalendar className="w-4 h-4 mb-0.5" />
              Journal
            </button>

            <button
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center py-1 px-1.5 rounded-lg transition ${activeTab === 'settings' ? st.activeNav : st.subtext}`}
            >
              <IconWatch className="w-4 h-4 mb-0.5" />
              Imports
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
