      'incline_db_bench_press': { coeff: 0.16, step: 1, min: 6, max: 32, unit: 'kg/haltère' },

    function getSuggestedStartingLoad(exerciseId, bodyweight = 78) {
      const cfg = START_LOAD_COEFFS[exerciseId];
      if (!cfg || cfg.step === 0) return { weight: 0, unit: 'pdc', isCalibrated: false };
      const raw = bodyweight * cfg.coeff;
      let stepped = Math.round(raw / cfg.step) * cfg.step;
      if (stepped < cfg.min) stepped = cfg.min;
      if (stepped > cfg.max) stepped = cfg.max;
      return { weight: stepped, unit: cfg.unit, isCalibrated: false };
    }

    function calculateNextTarget(exercise, history = [], dominantFeel = 'perfect', checkin = 'good', bodyweight = 78) {
      const [lo, hi] = exercise.repRange || [10, 12];
      const step = exercise.increment || 1;
      const unit = exercise.unit || 'kg';

      if (!history || history.length === 0) {
        const start = getSuggestedStartingLoad(exercise.id, bodyweight);
        return {
          targetWeight: start.weight,
          targetReps: lo,
          why: `Charge de départ prudente (${start.weight} ${unit}) calculée pour ${bodyweight}kg`,
          status: 'start'
        };
      }

      const lastSession = history[0];
      const lastSets = lastSession.sets || [];
      if (lastSets.length === 0) {
        return { targetWeight: lastSession.weight || 10, targetReps: lo, why: 'Reprise sur dernière valeur', status: 'resume' };
      }

      const lastWeight = lastSets[0].weight;
      const minRepsHit = Math.min(...lastSets.map(s => s.reps));
      const allHitTop = lastSets.every(s => s.reps >= hi);
      const struggled = lastSets.some(s => s.reps < lo) || dominantFeel === 'hard';

      if (checkin === 'pain') {
        return {
          targetWeight: Math.max(0, lastWeight - step * 2),
          targetReps: lo,
          why: 'Sécurisation lombaire (check-in tension/douleur)',
          status: 'deload'
        };
      }

      // Bump weight when all sets reach top reps
      if (allHitTop && dominantFeel !== 'hard') {
        const newWeight = lastWeight + step;
        return {
          targetWeight: newWeight,
          targetReps: lo,
          why: `+${step} ${unit} : ${lastSets.length}×${hi} réussis ! Retour au bas de fourchette (${lo} reps)`,
          status: 'bump'
        };
      }

      // Deload on struggle
      if (struggled) {
        const newWeight = Math.max(exercise.minWeight || 0, lastWeight - step);
        return {
          targetWeight: newWeight,
          targetReps: lo,
          why: `Ajustement confort : charge allégée de ${step} ${unit} pour stabiliser la forme`,
          status: 'deload'
        };
      }

      // Reps progression
      const nextRepTarget = Math.min(hi, minRepsHit + 1);
      return {
        targetWeight: lastWeight,
        targetReps: nextRepTarget,
        why: `+1 rep visée (${nextRepTarget} reps @ ${lastWeight} ${unit}) avant d'augmenter le poids`,
        status: 'reps_progress'
      };
    }

    const playChime = (freq = 528, type = 'sine', duration = 0.35) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    const formatShortDate = (isoStr) => {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    };

    const formatClockTime = (isoStr) => {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    };

    // Calculate Streak & Weekly Activities
    const computeStreakAndWeek = (workouts = []) => {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];
      
      // Build set of unique workout dates
      const dateSet = new Set(workouts.map(w => (w.date || '').split('T')[0]));
      
      let streak = 0;
      let checkDate = new Date(now);
      // If no workout today, check if yesterday was done to preserve streak
      if (!dateSet.has(todayStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
      }
      while (dateSet.has(checkDate.toISOString().split('T')[0])) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      }

      // Compute days of current week (Mon-Sun)
      const currentDay = now.getDay(); // 0 is Sun
      const distanceToMon = currentDay === 0 ? -6 : 1 - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + distanceToMon);

      const weekDays = [];
      const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dStr = d.toISOString().split('T')[0];
        const isToday = dStr === todayStr;
        const hasWorkout = dateSet.has(dStr);
        weekDays.push({
          label: dayNames[i],
          dayNum: d.getDate(),
          dateStr: dStr,
          isToday,
          hasWorkout
        });
      }

      return { streak, weekDays };
    };

    // ==========================================
    // 7. GYM SESSION RUNNER COMPONENT
    // ==========================================
    function GymSessionRunner({ workout, userBodyweight, liftsHistory, shortMode, checkinStatus, onClose, onSaveSession }) {
      // Filter pairs if shortMode is active
      const pairs = useMemo(() => {
        if (!shortMode) return workout.pairs;
        return workout.pairs.filter(p => !p.isAccessory);
      }, [workout, shortMode]);

      // Flatten exercises sequence for supersets
      const sequence = useMemo(() => {
        const items = [];
        pairs.forEach(pair => {
          const setsCount = pair.exercises[0].sets;
          for (let s = 1; s <= setsCount; s++) {
            pair.exercises.forEach(ex => {
              items.push({
                pairId: pair.pairId,
                pairName: pair.name,
                setNum: s,
                totalSets: setsCount,
                exercise: ex
              });
            });
          }
        });
        return items;
      }, [pairs]);

      const [currentIndex, setCurrentIndex] = useState(0);
      const currentStep = sequence[currentIndex];
      const isLastStep = currentIndex === sequence.length - 1;

      // Completed sets store
      const [completedSets, setCompletedSets] = useState([]);

      // Current set inputs
      const [currentWeight, setCurrentWeight] = useState(10);
      const [currentReps, setCurrentReps] = useState(10);
      const [targetInfo, setTargetInfo] = useState({ targetWeight: 10, targetReps: 10, why: '' });
      const [showAlternative, setShowAlternative] = useState(false);

      // Rest Timer State
      const [isResting, setIsResting] = useState(false);
      const [restRemaining, setRestRemaining] = useState(45);
      const restIntervalRef = useRef(null);

      // Start time
      const startTimeRef = useRef(Date.now());

      // Wake Lock
      useEffect(() => {
        let wakeLock = null;
        if ('wakeLock' in navigator) {
          navigator.wakeLock.request('screen').then(wl => { wakeLock = wl; }).catch(() => {});
        }
        return () => {
          if (wakeLock) wakeLock.release().catch(() => {});
        };
      }, []);

      // Calculate target or adopt intra-session adjusted load
      useEffect(() => {
        if (!currentStep) return;
        const ex = currentStep.exercise;
        const prevSetsThisSession = completedSets.filter(s => s.exerciseId === ex.id);

        if (prevSetsThisSession.length > 0) {
          const lastSet = prevSetsThisSession[prevSetsThisSession.length - 1];
          let nextW = lastSet.weight;
          let nextR = lastSet.reps;
          let whyText = `Série ${currentStep.setNum} : maintien de ${nextW} ${ex.unit}`;

          // Intra-session adaptation based on previous set feel
          if (lastSet.feel === 'easy' && ex.increment > 0) {
            nextW += ex.increment;
            whyText = `⚡ Adaptation intra-séance : +${ex.increment} ${ex.unit} (ressenti facile sur série précédente)`;
          } else if (lastSet.feel === 'hard' && ex.increment > 0) {
            nextW = Math.max(ex.minWeight || 0, nextW - ex.increment);
            whyText = `🛡️ Sécurisation dos : -${ex.increment} ${ex.unit} (allègement pour préserver les lombaires)`;
          }

          setCurrentWeight(nextW);
          setCurrentReps(nextR);
          setTargetInfo({ targetWeight: nextW, targetReps: nextR, why: whyText });
          speakVoice(`Série ${currentStep.setNum}. ${nextR} répétitions à ${nextW} kilos.`);
          return;
        }

        // Initial target from historical lifts
        const hist = liftsHistory[ex.id] || [];
        const target = calculateNextTarget(ex, hist, 'perfect', checkinStatus, userBodyweight);
        setTargetInfo(target);
        setCurrentWeight(target.targetWeight);
        setCurrentReps(target.targetReps);
        setShowAlternative(false);

        // Voice cue
        speakVoice(`${currentStep.setNum === 1 ? ex.name : `Série ${currentStep.setNum}`}. Cible : ${target.targetReps} répétitions à ${target.targetWeight} kilos.`);
      }, [currentIndex, currentStep]);

      // Rest countdown effect
      useEffect(() => {
        if (!isResting) return;
        restIntervalRef.current = setInterval(() => {
          setRestRemaining(prev => {
            if (prev <= 1) {
              clearInterval(restIntervalRef.current);
              setIsResting(false);
              playChime(660, 'sine', 0.4);
              triggerHaptics([60, 60]);
              speakVoice('Fin du repos. Prêt pour la série suivante.');
              return 45;
            }
            if (prev === 4) {
              playChime(440, 'sine', 0.15);
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(restIntervalRef.current);
      }, [isResting]);

      const handleValidateSet = (feel = 'perfect') => {
        const record = {
          exerciseId: currentStep.exercise.id,
          name: currentStep.exercise.name,
          setNum: currentStep.setNum,
          weight: currentWeight,
          reps: currentReps,
          feel
        };

        const updated = [...completedSets, record];
        setCompletedSets(updated);
        triggerHaptics([40, 40]);
        playChime(587, 'sine', 0.25);

        if (isLastStep) {
          // Finished workout! Calculate volume
          const volume = updated.reduce((acc, s) => acc + (s.weight * s.reps), 0);
          const duration = Math.round((Date.now() - startTimeRef.current) / 60000);
          onSaveSession(updated, volume, duration);
        } else {
          // Start rest timer
          setIsResting(true);
          setRestRemaining(45);
          setCurrentIndex(prev => prev + 1);
        }
      };

      if (!currentStep) return null;

      const progressPercent = Math.round((currentIndex / sequence.length) * 100);

      return (
        <div className="fixed inset-0 z-50 bg-[#0b0f14] text-white flex flex-col justify-between p-4 safe-top safe-bottom">
          {/* Top Bar */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <button
                onClick={() => {
                  if (confirm('Quitter la séance en cours ?')) onClose();
                }}
                className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-400"
              >
                <IconClose className="w-5 h-5" />
              </button>

              <div className="text-center">
                <span className="text-xs font-black uppercase tracking-wider text-violet-400">
                  {workout.title} {shortMode && '· 20 MIN'}
                </span>
                <p className="text-[11px] text-slate-400">
                  Étape {currentIndex + 1} / {sequence.length}
                </p>
              </div>

              <div className="text-xs font-bold text-slate-400">
                {progressPercent}%
              </div>
            </div>

            {/* Progress bar */}
            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-violet-600 to-indigo-500 transition-all duration-300"
                style={{ width: `${progressPercent}%` }}
              />
            </div>
          </div>

          {/* REST TIMER FULLSCREEN OVERLAY */}
          {isResting ? (
            <div className="flex-1 flex flex-col items-center justify-center space-y-6">
              <span className="text-sm font-bold uppercase tracking-wider text-slate-400">
                Temps de repos (Superset)
              </span>

              {/* Big Countdown */}
              <div className="relative w-48 h-48 rounded-full border-4 border-violet-500/30 flex items-center justify-center">
                <div className="text-center">
                  <span className="text-6xl font-black text-white">{restRemaining}</span>
                  <span className="block text-xs uppercase text-violet-400 mt-1">secondes</span>
                </div>
              </div>

              {/* Next Exercise Preview */}
              <div className="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-center max-w-xs">
                <span className="text-[10px] uppercase font-bold text-slate-500">Exercice suivant</span>
                <p className="text-sm font-bold text-white mt-0.5">{currentStep.exercise.name}</p>
                <p className="text-xs text-slate-400">Série {currentStep.setNum} / {currentStep.totalSets}</p>
              </div>

              {/* Actions */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setRestRemaining(prev => prev + 15)}
                  className="px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 btn-press"
                >
                  +15s
                </button>
                <button
                  onClick={() => setIsResting(false)}
                  className="px-6 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 font-bold text-xs text-white btn-press"
                >
                  Passer le repos
                </button>
              </div>
            </div>
          ) : (
            /* ACTIVE EXERCISE VIEW */
            <div className="flex-1 flex flex-col justify-center space-y-5 my-auto">
              {/* Exercise Header */}
              <div className="text-center space-y-1">
                <span className="text-xs font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">
                  {currentStep.pairName} · SÉRIE {currentStep.setNum} / {currentStep.totalSets}
                </span>

                <h2 className="text-2xl font-black text-white tracking-tight mt-1">
                  {showAlternative && currentStep.exercise.alternative
                    ? currentStep.exercise.alternative
                    : currentStep.exercise.name}
                </h2>

                <p className="text-xs text-slate-300 px-4 leading-relaxed">
                  {currentStep.exercise.cue}
                </p>

                {currentStep.exercise.alternative && (
                  <button
                    onClick={() => setShowAlternative(prev => !prev)}
                    className="text-[11px] text-amber-400 underline font-semibold mt-1"
                  >
                    {showAlternative ? 'Revenir à l’original' : 'Machine prise ? Alternative'}
                  </button>
                )}
              </div>

              {/* Why Badge / Coach Hint */}
              {targetInfo.why && (
                <div className="mx-auto px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-violet-300 flex items-center gap-1.5 shadow-sm">
                  <span>💡</span>
                  <span>{targetInfo.why}</span>
                </div>
              )}

              {/* Huge Steppers for Weight & Reps */}
              <div className="grid grid-cols-2 gap-3 max-w-sm mx-auto w-full">
                {/* Weight Stepper */}
                <div className="p-4 rounded-3xl bg-slate-900 border border-slate-800 text-center space-y-2">
                  <span className="text-xs font-bold uppercase text-slate-400">
                    Poids ({currentStep.exercise.unit})
                  </span>
                  <div className="text-4xl font-black text-white">
                    {currentStep.exercise.increment === 0 ? 'PDC' : currentWeight}
                  </div>
                  {currentStep.exercise.increment > 0 && (
                    <div className="flex items-center justify-center gap-2 pt-1">
                      <button
                        onClick={() => setCurrentWeight(prev => Math.max(currentStep.exercise.minWeight || 0, prev - currentStep.exercise.increment))}
                        className="w-10 h-10 rounded-xl bg-slate-800 text-lg font-bold flex items-center justify-center text-slate-300 btn-press"
                      >
                        -
                      </button>
                      <button
                        onClick={() => setCurrentWeight(prev => prev + currentStep.exercise.increment)}
                        className="w-10 h-10 rounded-xl bg-slate-800 text-lg font-bold flex items-center justify-center text-slate-300 btn-press"
                      >
                        +
                      </button>
                    </div>
                  )}
                </div>

                {/* Reps Stepper */}
                <div className="p-4 rounded-3xl bg-slate-900 border border-slate-800 text-center space-y-2">
                  <span className="text-xs font-bold uppercase text-slate-400">Répétitions</span>
                  <div className="text-4xl font-black text-white">
                    {currentReps}
                  </div>
                  <div className="flex items-center justify-center gap-2 pt-1">
                    <button
                      onClick={() => setCurrentReps(prev => Math.max(1, prev - 1))}
                      className="w-10 h-10 rounded-xl bg-slate-800 text-lg font-bold flex items-center justify-center text-slate-300 btn-press"
                    >
                      -
                    </button>
                    <button
                      onClick={() => setCurrentReps(prev => prev + 1)}
                      className="w-10 h-10 rounded-xl bg-slate-800 text-lg font-bold flex items-center justify-center text-slate-300 btn-press"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Action Section */}
          {!isResting && (
            <div className="space-y-2 pt-2">
              <button
                onClick={() => handleValidateSet('perfect')}
                className="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-black text-lg tracking-wide shadow-xl shadow-violet-600/30 flex items-center justify-center gap-2 btn-press"
              >
                <IconCheck className="w-6 h-6 stroke-[3]" />
                <span>{isLastStep ? 'VALIDER & TERMINER' : 'VALIDER LA SÉRIE'}</span>
              </button>

              {/* Quick Feel Options */}
              <div className="grid grid-cols-3 gap-2">
                <button
                  onClick={() => handleValidateSet('easy')}
                  className="py-2 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-bold text-emerald-400 btn-press"
                >
                  🟢 Trop facile
                </button>
                <button
                  onClick={() => handleValidateSet('perfect')}
                  className="py-2 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-bold text-cyan-400 btn-press"
                >
                  🔵 Parfait
                </button>
                <button
                  onClick={() => handleValidateSet('hard')}
                  className="py-2 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-bold text-rose-400 btn-press"
                >
                  🔴 Trop dur
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. CONCEPT2 INTERVAL RUNNER
    // ==========================================
    function Concept2IntervalRunner({ config, onClose, onSaveSession }) {
      const [currentRound, setCurrentRound] = useState(1);
      const [isWorkPhase, setIsWorkPhase] = useState(true);
      const [secondsLeft, setSecondsLeft] = useState(config.workSec);
      const [isWarmup, setIsWarmup] = useState(true);
      const [warmupLeft, setWarmupLeft] = useState(config.warmupSec);
      const [isRunning, setIsRunning] = useState(true);

      useEffect(() => {
        if (!isRunning) return;
        const interval = setInterval(() => {
          // Warmup phase
          if (isWarmup) {
            setWarmupLeft(prev => {
              if (prev <= 1) {
                setIsWarmup(false);
                setIsWorkPhase(true);
                setSecondsLeft(config.workSec);
                playChime(660, 'sine', 0.5);
                speakVoice('Échauffement terminé. Début du round 1 : 1 minute à 120-140 Watts.');
                return 0;
              }
              return prev - 1;
            });
            return;
          }

          // Main Interval rounds
          setSecondsLeft(prev => {
            if (prev <= 1) {
              if (isWorkPhase) {
                // Switch to Rest
                setIsWorkPhase(false);
                playChime(440, 'sine', 0.4);
                speakVoice('Repos complet. 1 minute.');
                return config.restSec;
              } else {
                // Switch to next Round Work
                if (currentRound >= config.rounds) {
                  clearInterval(interval);
                  onSaveSession(20);
                  return 0;
                }
                setCurrentRound(r => r + 1);
                setIsWorkPhase(true);
                playChime(660, 'sine', 0.5);
                speakVoice(`Round ${currentRound + 1}. Propulsion 120 à 140 Watts.`);
                return config.workSec;
              }
            }
            if (prev === 4) playChime(528, 'sine', 0.15);
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isRunning, isWarmup, isWorkPhase, currentRound]);

      return (
        <div className="fixed inset-0 z-50 bg-[#0b0f14] text-white flex flex-col justify-between p-4 safe-top safe-bottom">
          <div className="flex items-center justify-between">
            <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
              <IconClose className="w-5 h-5" />
            </button>
            <span className="text-xs font-black uppercase text-cyan-400">
              {isWarmup ? 'ÉCHAUFFEMENT FEET OUT' : `ROUND ${currentRound} / ${config.rounds}`}
            </span>
            <button onClick={() => setIsRunning(r => !r)} className="text-xs font-bold text-slate-300">
              {isRunning ? 'Pause' : 'Reprendre'}
            </button>
          </div>

          <div className="text-center space-y-4 my-auto">
            <span className={`text-sm font-black uppercase tracking-wider px-3 py-1 rounded-full ${
              isWarmup ? 'bg-amber-500/20 text-amber-300' :
              isWorkPhase ? 'bg-cyan-500/20 text-cyan-300' : 'bg-slate-800 text-slate-400'
            }`}>
              {isWarmup ? 'Feet Out (Sans sangles)' : isWorkPhase ? 'PROPULSION (ON)' : 'RÉCUPÉRATION (OFF)'}
            </span>

            <div className="text-7xl font-black text-white">
              {isWarmup ? `${Math.floor(warmupLeft / 60)}:${String(warmupLeft % 60).padStart(2, '0')}` : `${secondsLeft}s`}
            </div>

            <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 max-w-sm mx-auto text-xs space-y-1">
              <div className="flex justify-between font-bold">
                <span>Cible Puissance :</span>
                <span className="text-cyan-400">{config.targetWatts}</span>
              </div>
              <div className="flex justify-between font-bold">
                <span>Cadence :</span>
                <span className="text-cyan-400">{config.targetSpm}</span>
              </div>
              <div className="flex justify-between font-bold">
                <span>Damper :</span>
                <span className="text-slate-300">{config.damper}</span>
              </div>
            </div>

            {isWarmup && (
              <button
                onClick={() => {
                  setIsWarmup(false);
                  setIsWorkPhase(true);
                  setSecondsLeft(config.workSec);
                }}
                className="text-xs text-cyan-400 underline font-semibold"
              >
                Passer l'échauffement →
              </button>
            )}
          </div>

          <button
            onClick={() => onSaveSession(20)}
            className="w-full py-3.5 rounded-2xl bg-cyan-600 hover:bg-cyan-500 font-bold text-sm text-white btn-press"
          >
            Terminer & Sauvegarder
          </button>
        </div>
      );
    }

    // ==========================================
    // 9. FLOOR ROUTINE RUNNER
    // ==========================================
    function FloorRoutineRunner({ routine, onClose, onSaveSession }) {
      const [stepIdx, setStepIdx] = useState(0);
      const currentEx = routine.exercises[stepIdx];

      return (
        <div className="fixed inset-0 z-50 bg-[#0b0f14] text-white flex flex-col justify-between p-4 safe-top safe-bottom">
          <div className="flex items-center justify-between">
            <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
              <IconClose className="w-5 h-5" />
            </button>
            <span className="text-xs font-black uppercase text-emerald-400">
              ROUTINE SOL {stepIdx + 1} / {routine.exercises.length}
            </span>
            <div className="w-9" />
          </div>

          <div className="text-center space-y-3 my-auto max-w-sm mx-auto">
            <h2 className="text-2xl font-black text-white">{currentEx.name}</h2>
            <div className="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 font-bold text-sm">
              {currentEx.setsText}
            </div>
            <p className="text-xs text-slate-300 leading-relaxed px-2">
              {currentEx.cue}
            </p>
          </div>

          <button
            onClick={() => {
              if (stepIdx < routine.exercises.length - 1) {
                setStepIdx(prev => prev + 1);
                playChime(528, 'sine', 0.3);
              } else {
                onSaveSession();
              }
            }}
            className="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold text-base text-white btn-press"
          >
            {stepIdx < routine.exercises.length - 1 ? 'Exercice Suivant →' : '✓ Terminer la Routine Sol'}
          </button>
        </div>
      );
    }

    // ==========================================
    // 10. AI CHAT MODAL
    // ==========================================
    function AiChatModal({ onClose, apiKey, onSaveApiKey, onExecuteTicket }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: "Bonjour ! Je suis votre coach biomécanique. Je connais votre posture de bureau, la fragilité L4-L5 et vos règles Spine-First. Que souhaitez-vous ajuster ou programmer aujourd'hui ?" }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = input.trim();
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setLoading(true);

        setTimeout(() => {
          let reply = "Je vous conseille de bien respecter la règle Spine-First. Si vous ressentez une raideur, privilégiez le banc incliné à 30-45° et terminez par la routine sol de 4 minutes.";
          if (userMsg.toLowerCase().includes('séance') || userMsg.toLowerCase().includes('programme')) {
            reply += "\n\nVoici un protocole adapté :\n```json\n[SESSION_DATA] {\"type\":\"WORK_GYM\",\"durationMin\":35,\"notes\":\"Muscu A adaptée par coach IA\"} [/SESSION_DATA]\n```";
          }
          setMessages(prev => [...prev, { role: 'assistant', text: reply }]);
          setLoading(false);
        }, 800);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur flex flex-col p-4 safe-top safe-bottom">
          <div className="flex items-center justify-between pb-3 border-b border-slate-800">
            <h3 className="text-base font-bold text-white flex items-center gap-1.5">
              <IconSparkles className="w-4 h-4 text-amber-400" />
              Coach IA Biomécanique
            </h3>
            <button onClick={onClose} className="text-slate-400">
              <IconClose className="w-5 h-5" />
            </button>
          </div>

          <div className="flex-1 overflow-y-auto py-4 space-y-3">
            {messages.map((m, idx) => (
              <div key={idx} className={`p-3 rounded-2xl text-xs max-w-[85%] ${
                m.role === 'user' ? 'ml-auto bg-violet-600 text-white' : 'mr-auto bg-slate-900 text-slate-200 border border-slate-800'
              }`}>
                {m.text}
                {m.text.includes('[SESSION_DATA]') && (
                  <button
                    onClick={() => {
                      const match = m.text.match(/\[SESSION_DATA\]([\s\S]*?)\[\/SESSION_DATA\]/);
                      if (match) {
                        try {
                          const data = JSON.parse(match[1].trim());
                          onExecuteTicket({
                            id: 'ai_' + Date.now(),
                            date: new Date().toISOString(),
                            ...data
                          });
                        } catch (e) {}
                      }
                    }}
                    className="mt-2 block w-full py-1.5 px-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-center"
                  >
                    ⚡ Valider la séance proposée en 1-Tap
                  </button>
                )}
              </div>
            ))}
            {loading && <div className="text-xs text-slate-500 italic">Le coach réfléchit...</div>}
          </div>

          <div className="flex items-center gap-2 pt-2">
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSend()}
              placeholder="Posez une question ou demandez une séance..."
              className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-violet-500"
            />
            <button onClick={handleSend} className="px-4 py-2.5 rounded-xl bg-violet-600 text-white font-bold text-xs btn-press">
              Envoyer
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // MOUNT APPLICATION
    // ==========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
